<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f2f7f4">
	<title>Sign in | areaMD</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			color-scheme: light;
			font-family: "DM Sans", sans-serif;
			color: #172e2a;
			background: #f2f7f4;
			font-synthesis: none;
			text-rendering: optimizeLegibility;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 32px;
			background-color: #f2f7f4;
			background-image: radial-gradient(#d8e5de 0.8px, transparent 0.8px);
			background-size: 18px 18px;
		}

		.login-shell {
			width: min(100%, 1040px);
			min-height: 620px;
			display: grid;
			grid-template-columns: 0.9fr 1.1fr;
			overflow: hidden;
			border: 1px solid #dce7e1;
			border-radius: 8px;
			background: #fff;
			box-shadow: 0 24px 70px rgb(23 46 42 / 10%);
			animation: arrive 500ms ease-out both;
		}

		.brand-panel {
			position: relative;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			overflow: hidden;
			padding: 48px;
			color: #fff;
			background: #126b5b;
			isolation: isolate;
		}

		.brand-panel::before,
		.brand-panel::after {
			position: absolute;
			z-index: -1;
			content: "";
			border: 1px solid rgb(255 255 255 / 16%);
			border-radius: 50%;
		}

		.brand-panel::before {
			width: 470px;
			height: 470px;
			right: -250px;
			bottom: -125px;
		}

		.brand-panel::after {
			width: 340px;
			height: 340px;
			right: -185px;
			bottom: -60px;
		}

		.wordmark {
			margin: 0;
			font: 800 31px/1 "Manrope", sans-serif;
			letter-spacing: 0;
		}

		.wordmark span { color: #f2bd72; }

		.brand-rule {
			width: 40px;
			height: 3px;
			margin: 0 0 22px;
			border: 0;
			background: #f2bd72;
		}

		.brand-caption {
			max-width: 250px;
			margin: 0;
			color: #d6ebe4;
			font-size: 14px;
			line-height: 1.7;
		}

		.brand-footer {
			margin: 0;
			color: #c1ded4;
			font-size: 12px;
		}

		.form-panel {
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 64px 72px;
		}

		.form-content {
			width: min(100%, 360px);
			animation: arrive 650ms 100ms ease-out both;
		}

		.eyebrow {
			margin: 0 0 12px;
			color: #177565;
			font-size: 11px;
			font-weight: 700;
			letter-spacing: 0;
			text-transform: uppercase;
		}

		h1 {
			margin: 0;
			color: #172e2a;
			font: 700 32px/1.2 "Manrope", sans-serif;
			letter-spacing: 0;
		}

		.intro {
			margin: 12px 0 32px;
			color: #697a75;
			font-size: 14px;
			line-height: 1.6;
		}

		.field { margin-bottom: 20px; }

		label {
			display: block;
			margin-bottom: 8px;
			color: #29423c;
			font-size: 13px;
			font-weight: 600;
		}

		input {
			width: 100%;
			height: 48px;
			padding: 0 14px;
			border: 1px solid #cbd8d2;
			border-radius: 4px;
			outline: none;
			background: #fff;
			color: #172e2a;
			font: inherit;
			font-size: 14px;
			transition: border-color 150ms ease, box-shadow 150ms ease;
		}

		input::placeholder { color: #9aa9a3; }

		input:focus {
			border-color: #177565;
			box-shadow: 0 0 0 3px rgb(23 117 101 / 14%);
		}

		.error {
			margin: 0 0 20px;
			padding: 11px 13px;
			border-left: 3px solid #c34435;
			background: #fff2ef;
			color: #8d2e23;
			font-size: 13px;
			line-height: 1.5;
		}

		button {
			width: 100%;
			height: 48px;
			margin-top: 8px;
			border: 0;
			border-radius: 4px;
			background: #126b5b;
			color: #fff;
			cursor: pointer;
			font: 700 14px "DM Sans", sans-serif;
			transition: background-color 150ms ease, transform 150ms ease;
		}

		button:hover { background: #0c594c; }
		button:active { transform: translateY(1px); }
		button:focus-visible { outline: 3px solid #f2bd72; outline-offset: 3px; }

		@keyframes arrive {
			from { opacity: 0; transform: translateY(8px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after {
				animation-duration: 0.01ms !important;
				transition-duration: 0.01ms !important;
			}
		}

		@media (max-width: 720px) {
			body { padding: 16px; }
			.login-shell { min-height: auto; grid-template-columns: 1fr; }
			.brand-panel { min-height: 165px; padding: 28px; }
			.brand-caption, .brand-footer { display: none; }
			.brand-rule { margin-bottom: 0; }
			.form-panel { padding: 42px 28px 48px; }
			h1 { font-size: 29px; }
		}
	</style>
</head>
<body>
	<main class="login-shell">
		<section class="brand-panel" aria-label="areaMD">
			<p class="wordmark">area<span>MD</span></p>
			<div>
				<hr class="brand-rule">
				<p class="brand-caption">Clinician access</p>
			</div>
			<p class="brand-footer">Secure sign in</p>
		</section>

		<section class="form-panel" aria-labelledby="login-heading">
			<div class="form-content">
				<p class="eyebrow">Doctor portal</p>
				<h1 id="login-heading">Welcome back</h1>
				<p class="intro">Sign in with your doctor name and password.</p>

				<form method="post" action="{{ url_for('index') }}">
					<div class="field">
						<label for="doctor-name">Doctor name</label>
						<input
							id="doctor-name"
							name="doctor_name"
							type="text"
							autocomplete="username"
							placeholder="Your registered name"
							value="{{ request.form.get('doctor_name', '') }}"
							required
							autofocus
						>
					</div>

					<div class="field">
						<label for="password">Password</label>
						<input
							id="password"
							name="password"
							type="password"
							autocomplete="current-password"
							placeholder="Enter your password"
							required
						>
					</div>

					{% if error %}
						<p class="error" role="alert">{{ error }}</p>
					{% endif %}

					<button type="submit">Sign in</button>
				</form>
			</div>
		</section>
	</main>
</body>
</html>
