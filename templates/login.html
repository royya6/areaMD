{% extends "base.html" %}

{% block title %}Doctor login · AreaMD{% endblock %}

{% block content %}
<section class="page-heading">
	<p class="eyebrow">Doctor portal</p>
	<h1>Doctor sign in</h1>
</section>

<form method="post" action="{{ url_for('login') }}" class="edit-form login-form">
	<label for="doctor-name">Doctor name</label>
	<input
		id="doctor-name"
		name="doctor_name"
		type="text"
		autocomplete="username"
		value="{{ request.form.get('doctor_name', '') }}"
		required
		autofocus
	>

	<label for="password">Password</label>
	<input
		id="password"
		name="password"
		type="password"
		autocomplete="current-password"
		required
	>

	{% if error %}
	<p class="form-error" role="alert">{{ error }}</p>
	{% endif %}

	<button class="primary-button" type="submit">Sign in</button>
</form>
{% endblock %}
